<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vemcert Vocabulary</title>
<style>
  :root { --bg:#fdfcfa; --surface:#fff; --fg:#1c1917; --muted:#57534e; --subtle:#78716c;
          --border:#e7e5e4; --accent:#6b1f2a; --code-bg:#f5f4f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1817; --surface:#232120; --fg:#f5f4f2; --muted:#a8a29e; --subtle:#8a8481;
            --border:#3a3735; --accent:#d4a373; --code-bg:#2a2725; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:2rem 1rem 5rem; background:var(--bg); color:var(--fg);
         font:16px/1.65 ui-serif, Georgia, "Times New Roman", serif; }
  main { max-width:56rem; margin:0 auto; }
  h1 { font-size:2rem; line-height:1.2; margin:0 0 .35rem; letter-spacing:-.02em; }
  h2 { font-size:1.3rem; margin:3rem 0 .75rem; padding-bottom:.4rem; border-bottom:1px solid var(--border); }
  p, li { color:var(--muted); }
  a { color:var(--accent); }
  code, .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.875em; }
  code { background:var(--code-bg); padding:.12em .35em; border-radius:3px; color:var(--fg); }
  .ns { display:inline-block; max-width:100%; overflow-wrap:anywhere; background:var(--code-bg);
        border:1px solid var(--border); border-radius:6px; padding:.5rem .75rem; margin:.25rem 0 1.5rem; }
  .scroll { overflow-x:auto; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
  table { width:100%; border-collapse:collapse; font-size:.9375rem; }
  th, td { text-align:left; padding:.7rem .9rem; border-bottom:1px solid var(--border); vertical-align:top; }
  th { font-weight:600; white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  td:first-child { white-space:nowrap; }
  td.desc { color:var(--muted); min-width:18rem; }
  .type { color:var(--subtle); font-size:.8125rem; white-space:nowrap; }
  footer { margin-top:4rem; padding-top:1.25rem; border-top:1px solid var(--border); color:var(--subtle); font-size:.875rem; }
</style>
</head>
<body>
<main>
  <h1>Vemcert Vocabulary</h1>
  <p>Terms used in the <code>credentialSubject</code> and <code>evidence</code> of W3C Verifiable
  Credentials issued with Vemcert.</p>
  <ul>
    <li><a href="v1.html">Version 1</a> &mdash; <code>https://w3id.org/vemcert/v1#</code> (<a href="v1.jsonld">JSON-LD</a>)</li>
  </ul>
  <footer>Maintained by <a href="https://github.com/gasmsyteacher">gasmsyteacher</a>.</footer>
</main>
</body>
</html>
